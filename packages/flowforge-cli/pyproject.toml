[project]
name = "flowforge-cli"
version = "0.1.0"
description = "CLI tool for FlowForge - AI workflow orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FlowForge Team"}
]
keywords = ["workflow", "orchestration", "ai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "watchfiles>=0.21.0",
]

[project.scripts]
flowforge = "flowforge_cli.main:app"

[project.urls]
Homepage = "https://github.com/flowforge/flowforge"
Documentation = "https://flowforge.dev/docs"
Repository = "https://github.com/flowforge/flowforge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "B008", "E712", "B007", "B023", "B905", "UP042", "UP045", "F401", "F841", "SIM102", "SIM103", "SIM105", "SIM108", "SIM117"]
