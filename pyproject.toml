[project]
name = "flowforge"
version = "0.1.0"
description = "A production-ready AI workflow orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FlowForge Team"}
]
keywords = ["workflow", "orchestration", "ai", "llm", "durable", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/flowforge/flowforge"
Documentation = "https://flowforge.dev/docs"
Repository = "https://github.com/flowforge/flowforge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/flowforge-sdk/src/flowforge", "packages/flowforge-cli/src/flowforge_cli", "server/src/flowforge_server"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["examples/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "B008", "E712", "B007", "B023", "B905", "UP042", "UP045", "F401", "F841", "SIM102", "SIM103", "SIM105", "SIM108", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
