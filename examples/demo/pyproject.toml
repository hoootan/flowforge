[project]
name = "flowforge-demo"
version = "0.1.0"
description = "Sample project demonstrating FlowForge AI agent capabilities"
requires-python = ">=3.11"
dependencies = [
    "flowforge-sdk[ai,fastapi]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
flowforge-demo = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]
