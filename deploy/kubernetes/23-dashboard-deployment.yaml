apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsUser: 1001  # nextjs uid from Dockerfile
        runAsNonRoot: true
      containers:
        - name: dashboard
          image: ghcr.io/flowforge/flowforge-dashboard:latest
          # Build image with: --build-arg NEXT_PUBLIC_API_URL=/api/v1
          # This makes the dashboard host-agnostic. The Ingress routes
          # /api/* to the server service, so no hardcoded IPs are needed.
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
