apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: executor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: executor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/component: executor
    spec:
      # Allow in-flight LLM steps to complete before pod is terminated.
      # preStop sleep + graceful shutdown should finish within this window.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        - name: wait-for-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://server:8000/api/v1/ready > /dev/null 2>&1; do
                echo "Waiting for server to be ready..."; sleep 5
              done
              echo "server is ready"
      containers:
        - name: executor
          image: ghcr.io/flowforge/flowforge-server:latest
          command:
            - python
            - -u
            - -m
            - flowforge_server.services.executor
          lifecycle:
            preStop:
              exec:
                # Give load balancer time to drain connections before shutdown
                command: ["sleep", "10"]
          envFrom:
            - configMapRef:
                name: flowforge-config
          env:
            - name: FLOWFORGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_DATABASE_URL
            - name: FLOWFORGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_ENCRYPTION_KEY
            - name: FLOWFORGE_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_ENCRYPTION_SALT
            # AI provider keys — all optional; executor only uses what's configured
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: GOOGLE_API_KEY
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: MISTRAL_API_KEY
                  optional: true
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: COHERE_API_KEY
                  optional: true
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; os.kill(1, 0)"
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
