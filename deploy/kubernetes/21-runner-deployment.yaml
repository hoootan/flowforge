apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: runner
  # Recreate — runner holds a Redis Streams consumer group membership.
  # Concurrent old+new pods would cause message duplication.
  # To scale beyond 1 replica, pass metadata.name via downward API as
  # consumer_name so each pod gets a unique consumer group identity.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/component: runner
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        - name: wait-for-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://server:8000/api/v1/ready > /dev/null 2>&1; do
                echo "Waiting for server to be ready..."; sleep 5
              done
              echo "server is ready"
      containers:
        - name: runner
          image: ghcr.io/flowforge/flowforge-server:latest
          command:
            - python
            - -u
            - -m
            - flowforge_server.services.runner
          envFrom:
            - configMapRef:
                name: flowforge-config
          env:
            - name: FLOWFORGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_DATABASE_URL
            - name: FLOWFORGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_ENCRYPTION_KEY
            - name: FLOWFORGE_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_ENCRYPTION_SALT
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; os.kill(1, 0)"
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
