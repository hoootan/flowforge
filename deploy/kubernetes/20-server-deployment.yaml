apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowforge
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done
              echo "postgres is ready"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for redis..."; sleep 2
              done
              echo "redis is ready"
      containers:
        - name: server
          image: ghcr.io/flowforge/flowforge-server:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: flowforge-config
          env:
            - name: FLOWFORGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_DATABASE_URL
            - name: FLOWFORGE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_JWT_SECRET
            - name: FLOWFORGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_ENCRYPTION_KEY
            - name: FLOWFORGE_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: flowforge-secret
                  key: FLOWFORGE_ENCRYPTION_SALT
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            # 30 × 10s = 5 min window — covers Alembic migration time
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
