# IMPORTANT: Never commit real secret values to version control.
# Replace all CHANGE_ME placeholders before applying.
# Production: use Sealed Secrets or External Secrets Operator
# (pointing to AWS Secrets Manager, HashiCorp Vault, etc.).
#
# Generate values:
#   FLOWFORGE_JWT_SECRET:      openssl rand -hex 32
#   FLOWFORGE_ENCRYPTION_KEY:  openssl rand -hex 32
#   FLOWFORGE_ENCRYPTION_SALT: openssl rand -hex 16
#   POSTGRES_PASSWORD:         openssl rand -base64 24
#
# Values must be base64-encoded:
#   echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: flowforge-secret
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
type: Opaque
stringData:
  # Database — full asyncpg URL including password
  FLOWFORGE_DATABASE_URL: "postgresql+asyncpg://flowforge:CHANGE_ME@postgres:5432/flowforge"

  # PostgreSQL password (used by the postgres StatefulSet)
  POSTGRES_PASSWORD: "CHANGE_ME"

  # JWT signing secret (server only)
  FLOWFORGE_JWT_SECRET: "CHANGE_ME"

  # Encryption key and salt (server, runner, executor)
  FLOWFORGE_ENCRYPTION_KEY: "CHANGE_ME"
  FLOWFORGE_ENCRYPTION_SALT: "CHANGE_ME"

  # AI provider API keys (executor only, all optional)
  ANTHROPIC_API_KEY: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
  GOOGLE_API_KEY: "CHANGE_ME"
  MISTRAL_API_KEY: "CHANGE_ME"
  COHERE_API_KEY: "CHANGE_ME"
