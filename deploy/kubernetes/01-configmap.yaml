apiVersion: v1
kind: ConfigMap
metadata:
  name: flowforge-config
  namespace: flowforge
  labels:
    app.kubernetes.io/name: flowforge
data:
  FLOWFORGE_ENV: "production"
  FLOWFORGE_REDIS_URL: "redis://redis:6379/0"
  FLOWFORGE_LOG_LEVEL: "INFO"
  FLOWFORGE_LOG_FORMAT: "json"
  FLOWFORGE_MAX_CONCURRENT_JOBS: "100"
  FLOWFORGE_WORKERS: "1"
  PYTHONUNBUFFERED: "1"
  FLOWFORGE_CORS_ALLOWED_ORIGINS: ""
