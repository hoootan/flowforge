# Alembic Configuration for FlowForge Server

[alembic]
# Path to migration scripts
script_location = alembic

# Template for generating migration revision IDs
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend version info to migration files
prepend_sys_path = .

# Timezone for generating revision timestamps
timezone = UTC

# truncate_slug_length limits slug to this number of characters
truncate_slug_length = 40

# Set to 'true' to allow ".hierarchylink" files
revision_environment = false

# Set to 'true' to run "env.py" during alembic commands
sourceless = false

# Version files location
version_locations = %(here)s/alembic/versions

# Version file naming convention
output_encoding = utf-8

# Database URL is set programmatically in env.py from FLOWFORGE_DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Use black for formatting generated migrations (optional)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
