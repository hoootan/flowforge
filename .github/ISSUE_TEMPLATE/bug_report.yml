name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, please search existing issues to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reliably reproduce the issue.
      placeholder: |
        1. Define a function with `@flowforge.function()`
        2. Send event `order/created`
        3. Observe that...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of FlowForge is affected?
      options:
        - Server
        - Python SDK (flowforge-sdk)
        - CLI (flowforge-cli)
        - TypeScript client (flowforge-client-ts)
        - Dashboard
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FlowForge version
      description: Output of `pip show flowforge-sdk` or the server version from `/health`.
      placeholder: "0.2.11"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Local development (flowforge dev)
        - Docker Compose
        - Kubernetes
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any stack traces, server logs, or error messages.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — OS, Python version, workflow snippet, etc.
