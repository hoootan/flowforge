name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement! Check existing issues and discussions first.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the pain point. What are you trying to do that is currently difficult or impossible?
      placeholder: "I'm always frustrated when..."

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should FlowForge do differently? Include API design, configuration options, or UX changes if relevant.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which component would this affect?
      options:
        - Server
        - Python SDK (flowforge-sdk)
        - CLI (flowforge-cli)
        - TypeScript client (flowforge-client-ts)
        - Dashboard
        - Multiple / unsure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you've already tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, code snippets, or anything else that helps explain the request.
