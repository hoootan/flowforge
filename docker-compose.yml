services:
  # PostgreSQL database for state persistence
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    # Note: postgres:alpine runs as non-root 'postgres' user by default
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for queues and event streaming
  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    # Note: redis:alpine runs as non-root 'redis' user by default
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FlowForge API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowforge-server
    restart: unless-stopped
    # Dockerfile sets USER flowforge (uid 1000) - this is redundant but explicit
    ports:
      - "8000:8000"
    environment:
      - FLOWFORGE_ENV=${FLOWFORGE_ENV:-development}
      - FLOWFORGE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/${POSTGRES_DB:-flowforge}
      - FLOWFORGE_REDIS_URL=redis://redis:6379/0
      # Security: JWT and Encryption (required for production)
      - FLOWFORGE_JWT_SECRET=${FLOWFORGE_JWT_SECRET:-flowforge-dev-jwt-secret-change-in-production}
      - FLOWFORGE_ENCRYPTION_KEY=${FLOWFORGE_ENCRYPTION_KEY:-flowforge-dev-encryption-key-change-in-prod}
      - FLOWFORGE_ENCRYPTION_SALT=${FLOWFORGE_ENCRYPTION_SALT:-}
      # CORS: Configure for production
      - FLOWFORGE_CORS_ALLOWED_ORIGINS=${FLOWFORGE_CORS_ALLOWED_ORIGINS:-}
      # Rate limiting
      - FLOWFORGE_LOGIN_RATE_LIMIT=${FLOWFORGE_LOGIN_RATE_LIMIT:-10}
      - FLOWFORGE_LOGIN_LOCKOUT_THRESHOLD=${FLOWFORGE_LOGIN_LOCKOUT_THRESHOLD:-5}
      - FLOWFORGE_LOGIN_LOCKOUT_DURATION=${FLOWFORGE_LOGIN_LOCKOUT_DURATION:-900}
      - FLOWFORGE_MEDIA_DIR=/app/media
      - FLOWFORGE_PUBLIC_URL=${FLOWFORGE_PUBLIC_URL:-http://localhost:8000}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FlowForge Runner - consumes events and creates runs
  runner:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowforge-runner
    restart: unless-stopped
    # Dockerfile sets USER flowforge (uid 1000)
    command: python -u -m flowforge_server.services.runner
    environment:
      - PYTHONUNBUFFERED=1
      - FLOWFORGE_ENV=${FLOWFORGE_ENV:-development}
      - FLOWFORGE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/${POSTGRES_DB:-flowforge}
      - FLOWFORGE_REDIS_URL=redis://redis:6379/0
      - FLOWFORGE_ENCRYPTION_KEY=${FLOWFORGE_ENCRYPTION_KEY:-flowforge-dev-encryption-key-change-in-prod}
      - FLOWFORGE_ENCRYPTION_SALT=${FLOWFORGE_ENCRYPTION_SALT:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy

  # FlowForge Executor - processes runs by invoking functions
  executor:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowforge-executor
    restart: unless-stopped
    # Dockerfile sets USER flowforge (uid 1000)
    command: python -u -m flowforge_server.services.executor
    environment:
      - PYTHONUNBUFFERED=1
      - FLOWFORGE_ENV=${FLOWFORGE_ENV:-development}
      - FLOWFORGE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/${POSTGRES_DB:-flowforge}
      - FLOWFORGE_REDIS_URL=redis://redis:6379/0
      - FLOWFORGE_ENCRYPTION_KEY=${FLOWFORGE_ENCRYPTION_KEY:-flowforge-dev-encryption-key-change-in-prod}
      - FLOWFORGE_ENCRYPTION_SALT=${FLOWFORGE_ENCRYPTION_SALT:-}
      # AI Provider API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - FLOWFORGE_MEDIA_DIR=/app/media
      - FLOWFORGE_PUBLIC_URL=${FLOWFORGE_PUBLIC_URL:-http://localhost:8000}
      - FLOWFORGE_MEDIA_STORAGE=${FLOWFORGE_MEDIA_STORAGE:-local}
      - FLOWFORGE_S3_BUCKET=${FLOWFORGE_S3_BUCKET:-}
      - FLOWFORGE_S3_REGION=${FLOWFORGE_S3_REGION:-}
      - FLOWFORGE_S3_ACCESS_KEY_ID=${FLOWFORGE_S3_ACCESS_KEY_ID:-}
      - FLOWFORGE_S3_SECRET_ACCESS_KEY=${FLOWFORGE_S3_SECRET_ACCESS_KEY:-}
      - FLOWFORGE_S3_ENDPOINT_URL=${FLOWFORGE_S3_ENDPOINT_URL:-}
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy

  # FlowForge Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://192.168.2.3:8000/api/v1
    container_name: flowforge-dashboard
    # Dockerfile sets USER nextjs (uid 1001)
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.2.3:8000/api/v1
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
