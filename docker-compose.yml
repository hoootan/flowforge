services:
  # PostgreSQL database for state persistence
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for queues and event streaming
  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FlowForge API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowforge-server
    ports:
      - "8000:8000"
    environment:
      - FLOWFORGE_ENV=development
      - FLOWFORGE_DATABASE_URL=postgresql+asyncpg://flowforge:flowforge@postgres:5432/flowforge
      - FLOWFORGE_REDIS_URL=redis://redis:6379/0
      - FLOWFORGE_JWT_SECRET=${FLOWFORGE_JWT_SECRET:-flowforge-dev-jwt-secret-change-in-production}
      - FLOWFORGE_ENCRYPTION_KEY=${FLOWFORGE_ENCRYPTION_KEY:-flowforge-dev-encryption-key-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FlowForge Runner - consumes events and creates runs
  runner:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowforge-runner
    command: python -u -m flowforge_server.services.runner
    environment:
      - PYTHONUNBUFFERED=1
      - FLOWFORGE_ENV=development
      - FLOWFORGE_DATABASE_URL=postgresql+asyncpg://flowforge:flowforge@postgres:5432/flowforge
      - FLOWFORGE_REDIS_URL=redis://redis:6379/0
    depends_on:
      server:
        condition: service_healthy

  # FlowForge Executor - processes runs by invoking functions
  executor:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowforge-executor
    command: python -u -m flowforge_server.services.executor
    environment:
      - PYTHONUNBUFFERED=1
      - FLOWFORGE_ENV=development
      - FLOWFORGE_DATABASE_URL=postgresql+asyncpg://flowforge:flowforge@postgres:5432/flowforge
      - FLOWFORGE_REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      server:
        condition: service_healthy

  # FlowForge Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: flowforge-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
